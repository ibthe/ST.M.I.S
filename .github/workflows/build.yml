name: Build desktop app

concurrency:
  group: stmis-build-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile src-tauri/python/worker.py
      - run: npm install
      - run: npm run build

  tauri:
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, macos-latest]
    runs-on: ${{ matrix.platform }}
    # macOS signing/notarization is activated automatically when the matching
    # GitHub Actions secrets are configured. Empty values keep unsigned CI builds usable.
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev patchelf libpipewire-0.3-dev
      - run: npm install
      - run: npm run tauri icon src-tauri/icons/stmis.svg
      - run: npm run tauri build
      - name: Upload desktop installers
        uses: actions/upload-artifact@v4
        with:
          name: ST-M-I-S-${{ runner.os }}-${{ runner.arch }}
          path: src-tauri/target/release/bundle/
          if-no-files-found: error
          retention-days: 14
