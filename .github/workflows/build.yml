name: Build desktop app

concurrency:
  group: stmis-build-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, fix/transparent-overlay-layout]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile src-tauri/python/worker.py
      - run: npm install
      - run: npm run build

  tauri:
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, macos-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - name: Set up Python for bundled offline worker
        if: runner.os == 'macOS' || runner.os == 'Windows'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare bundled offline runtime (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/package-windows-runtime.ps1
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev patchelf libpipewire-0.3-dev
      - run: npm install
      - run: npm run tauri icon src-tauri/icons/stmis.svg
      - name: Prepare bundled offline runtime (Apple Silicon)
        if: runner.os == 'macOS' && runner.arch == 'ARM64'
        run: bash scripts/package-macos-runtime.sh
      - run: npm run tauri build
      - name: Ad-hoc sign macOS app and rebuild DMG
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          # Ad-hoc signing protects bundle integrity; it is not Developer ID signing
          # and does not notarize the app or bypass Gatekeeper for quarantined downloads.
          codesign --force --deep --sign - "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          DMG_DIR="src-tauri/target/release/bundle/dmg"
          mkdir -p "$DMG_DIR"
          DMG_PATH="$DMG_DIR/ST.M.I.S_0.1.0_aarch64.dmg"
          rm -f "$DMG_PATH"
          hdiutil create -volname "ST.M.I.S" -srcfolder "$APP_PATH" -ov -format UDZO "$DMG_PATH"
      - name: Upload macOS DMG
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ST-M-I-S-macOS-${{ runner.arch }}
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14
      - name: Upload Windows installers
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ST-M-I-S-Windows-${{ runner.arch }}
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 14
